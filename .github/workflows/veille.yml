name: ASRC Tech Watch

on:
  schedule:
    - cron: '15 7 * * *'
      timezone: 'Europe/Paris'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Collecte automatique
        run: npm run collect

      - name: Commit des données
        run: |
          git config user.name "asrc-tech-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/veille.json
          git diff --cached --quiet || git commit -m "chore: mise à jour de la veille"
          git push